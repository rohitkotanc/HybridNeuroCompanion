[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-neuro-backend"
version = "0.1.0"
description = "Clinician-support seizure workflow prototype backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "scikit-learn>=1.5.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "python-dateutil>=2.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
